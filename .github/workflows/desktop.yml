name: Desktop build

on:
  push:
    branches:
      - master
    tags:
      - "app-v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system libraries and ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # --no-deps：只警告我们自己的代码。依赖库（tauri 系等）在 windows 宿主机
      # 编译构建脚本时会暴露它们自身的 clippy 警告，不由本仓库把关。
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Windows 包内置 ffmpeg/ffprobe（与 build-windows.yml 同源逻辑）：
      # 用户端「一键配置运行环境」从安装包资源复制，零下载。
      - name: 预置 ffmpeg 到安装包资源
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          curl.exe -sSL --retry 5 --max-time 600 -o $zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          if (-not (Test-Path $zip)) { throw "ffmpeg zip 下载失败" }
          $stage = "$env:RUNNER_TEMP\ffstage"
          Expand-Archive -Force $zip $stage
          $bin = (Get-ChildItem -Recurse -Filter ffmpeg.exe $stage | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force src-tauri/resources/ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" src-tauri/resources/ffmpeg/
          Get-ChildItem src-tauri/resources/ffmpeg | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 三个平台构建全部成功后，由这**一个** job 统一创建 Release。
  #
  # 为什么不给上面三个 bundle job 直接加发布参数：它们是**并行**跑的，若各自
  # 去创建同一个 Release，会出现「都查到不存在 → 都去创建 → 其中一个失败」
  # 的竞态。单一执行者没有这个问题，且 needs 天然保证「三平台全绿才发布」，
  # 不会产生残缺的 Release。
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 只取安装包本体：产物解包后 .app/Contents/ 下的散装文件
          # （Info.plist、可执行文件、图标）位于 macos/ 目录，用 **/* 会把它们
          # 一并传上去，用户会看到一堆无意义条目。
          files: |
            artifacts/*/*.exe
            artifacts/*/dmg/*.dmg
            artifacts/SHA256SUMS.txt
          # 任一平台产物缺失就失败，不静默发一个残缺的 Release。
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
          body: |
            > 本项目仅用于技术学习与交流，不用于实际报审提交或对外分发。

            ## 安装前请注意

            **安装包未做代码签名**，系统会给出安全提示，这是正常的：

            - **Windows**：首次运行可能弹出 SmartScreen 提示，点「更多信息」→「仍要运行」。
            - **macOS**：首次打开请在 Finder 中**右键点图标 → 选「打开」**，之后双击即可。直接双击会被 Gatekeeper 拦截。

            **内置运行环境（免手动装 FFmpeg）**：Windows 版安装包已内置
            ffmpeg/ffprobe，应用内点「一键配置运行环境」即可离线完成；macOS
            Apple Silicon 版支持一键在线安装。均无需手动配置 PATH。

            **macOS Intel 版**：不支持一键配置，需手动安装 FFmpeg 并在设置里指定路径。

            ## 已知问题

            - 分集表格的「集号」「文件名」两列可能显示为空白：后端结构体缺少 camelCase 序列化声明，界面读不到这两个字段。**不影响生成的材料包内容**，报告数据本身完整。

            下载后可对照本页 `SHA256SUMS.txt` 校验完整性。
