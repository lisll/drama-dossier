name: Desktop build

on:
  push:
    branches:
      - master
    tags:
      - "app-v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system libraries and ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      # 前端是纯 JS（没有打包步骤），各平台结果一样，只在 Linux 上跑。
      - name: Install Node.js
        if: runner.os == 'Linux'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend syntax
        if: runner.os == 'Linux'
        # node --check 只检查第一个文件，后面的会被当成脚本参数，所以要逐个检查。
        run: for file in src/main.js src/logic.js src/theme.js; do node --check "$file"; done
      - name: Frontend tests
        if: runner.os == 'Linux'
        # 写成 glob：Node 22 的 --test 把目录参数当成文件找，会直接失败。
        run: node --test 'tests/frontend/*.test.js'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    env:
      # 授权公钥提到 job 级：构建步骤要用它编译注入，后面的「未注入」告警也要读同一个值。
      # **不注入的话装出来的客户端登录不了**——`BUILTIN_KEYS` 是空列表，
      # 而 `option_env!("DOSSIER_LICENSE_PUBKEYS")` 在没注入时是 None，
      # 于是信任公钥集合为空，服务端签发的授权凭证一律验不过。
      # 值来自 `drama-commerce keyinfo <私钥文件>` 打印的 `public_key`
      # （base64url；多把用英文逗号分隔，供密钥轮换期并存）。
      DOSSIER_LICENSE_PUBKEYS: ${{ secrets.DOSSIER_LICENSE_PUBKEYS }}
      # 服务端地址（编译时写进程序，api.rs 的 `resolve_base`）。地址不是机密，
      # 放仓库 Variables，不放 Secrets。变量没配置时是空字符串——
      # 程序里已把空串当「没配」、退回默认 http://127.0.0.1:8100（只连得到本机）。
      # 部署后两个服务经 Caddy 共用一个 https 入口，所以通常只需要 DOSSIER_API_BASE；
      # 媒体控制面另走一个入口时才需要 DOSSIER_MEDIA_BASE。
      DOSSIER_API_BASE: ${{ vars.DOSSIER_API_BASE }}
      DOSSIER_MEDIA_BASE: ${{ vars.DOSSIER_MEDIA_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ---------- 签名（M7-8）----------
      #
      # 总方案要求「macOS 签名与公证、Windows 代码签名的流程写进 CI，证书用占位；
      # 没配证书时跳过签名，并明确提示」。
      #
      # 这里刻意**不**用 `continue-on-error`：签名失败必须让构建红掉，
      # 否则会出现「以为签了，其实没签」的包被发布出去。只有「没配证书」
      # 这一种情况才是跳过——那是部署方还没买证书，不是签名出错。
      - name: Detect signing secrets
        id: signing
        shell: bash
        env:
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE }}
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" && -n "$MAC_CERT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS 签名已启用（使用 secrets.MACOS_CERTIFICATE）"
          elif [[ "$RUNNER_OS" == "Windows" && -n "$WIN_CERT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Windows 代码签名已启用（使用 secrets.WINDOWS_CERTIFICATE）"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=构建产物未签名::"
            echo "没有配置签名证书（secrets.MACOS_CERTIFICATE / WINDOWS_CERTIFICATE）。"
            echo "本次产出的安装包**未签名**：Windows 会弹 SmartScreen 警告，"
            echo "macOS 需要右键「打开」才能启动。正式分发前请配置证书。"
          fi

      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          # 证书与密码只出现在这一步的环境变量里；写入临时钥匙串后立即清理。
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && steps.signing.outputs.enabled == 'true'
        id: win_cert
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # 证书写成临时 PFX 文件；路径通过 step 输出传给构建步骤。
          $path = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          echo "cert_path=$path" >> $env:GITHUB_OUTPUT

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 授权公钥在 job 级 env 里（见上），这里不用重复。
          # macOS：证书已在前一步导入钥匙串，这里只告诉 tauri 用哪个签名身份。
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.enabled == 'true' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          # 公证凭据（可选）：没有就不公证，安装包仍可用但要右键打开。
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MACOS_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          # Windows：证书路径由前一步的输出传来（没配证书时为空字符串）。
          TAURI_WINDOWS_CERTIFICATE_PATH: ${{ steps.win_cert.outputs.cert_path }}
          TAURI_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: .
          args: ${{ matrix.args }}

      - name: Warn when no license key was injected
        if: env.DOSSIER_LICENSE_PUBKEYS == ''
        shell: bash
        run: |
          # 明确指出后果，避免「装完发现登录不了」却不知道原因。
          echo "::warning title=未注入授权公钥::"
          echo "没有配置 secrets.DOSSIER_LICENSE_PUBKEYS。"
          echo "本安装包的信任公钥列表为空，**无法通过任何授权验证**："
          echo "登录后会一直停在锁定页。仅可用于界面走查，不能做真实登录测试。"
          echo "修法：在仓库 Secrets 里加 DOSSIER_LICENSE_PUBKEYS，"
          echo "值取 drama-commerce keyinfo 打印的 public_key。"

      - name: Warn when no server address was injected
        if: vars.DOSSIER_API_BASE == ''
        shell: bash
        run: |
          # 地址默认是本机开发服务，装到用户电脑上什么都连不上——必须说清楚。
          echo "::warning title=未注入服务端地址::"
          echo "没有配置仓库变量 DOSSIER_API_BASE。"
          echo "本安装包只连编译进程序的默认值 http://127.0.0.1:8100，"
          echo "装到别的电脑上登录、授权、充值等服务端功能都用不了。"
          echo "修法：Settings → Secrets and variables → Actions → Variables"
          echo "里加 DOSSIER_API_BASE（部署后的 https 入口）。"
          echo "服务端处理（上传、任务）另走一个入口时，再配 DOSSIER_MEDIA_BASE；"
          echo "共用一个入口则不用配。"

      - name: Clean up signing material
        if: always() && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          # 无论构建成没成功都清掉临时证书文件：runner 虽然是临时的，
          # 但没有理由让私钥在上面多留一刻。
          rm -f "${RUNNER_TEMP}/cert.p12" "${RUNNER_TEMP}/cert.pfx" 2>/dev/null || true
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          fi
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 三个平台构建全部成功后，由这**一个** job 统一创建 Release。
  #
  # 为什么不给上面三个 bundle job 直接加发布参数：它们是**并行**跑的，若各自
  # 去创建同一个 Release，会出现「都查到不存在 → 都去创建 → 其中一个失败」
  # 的竞态。单一执行者没有这个问题，且 needs 天然保证「三平台全绿才发布」，
  # 不会产生残缺的 Release。
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 只取安装包本体：产物解包后 .app/Contents/ 下的散装文件
          # （Info.plist、可执行文件、图标）位于 macos/ 目录，用 **/* 会把它们
          # 一并传上去，用户会看到一堆无意义条目。
          files: |
            artifacts/*/*.exe
            artifacts/*/dmg/*.dmg
            artifacts/SHA256SUMS.txt
          # 任一平台产物缺失就失败，不静默发一个残缺的 Release。
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
          body: |
            > 本项目仅用于技术学习与交流，不用于实际报审提交或对外分发。

            ## 安装前请注意

            **安装包未做代码签名**，系统会给出安全提示，这是正常的：

            - **Windows**：首次运行可能弹出 SmartScreen 提示，点「更多信息」→「仍要运行」。
            - **macOS**：首次打开请在 Finder 中**右键点图标 → 选「打开」**，之后双击即可。直接双击会被 Gatekeeper 拦截。

            **需要自行安装 FFmpeg**：应用通过外部 `ffprobe` 读取视频信息，不捆绑 FFmpeg。请先安装 FFmpeg 并确保 `ffprobe` 在 PATH 中，或在应用设置里手动指定路径。没有 `ffprobe` 时无法读取分集信息。

            **macOS Intel 版**：不支持运行环境一键配置（该功能仅 macOS + Apple Silicon），需手动安装 FFmpeg 并在设置里指定路径。

            ## 已知问题

            - 分集表格的「集号」「文件名」两列可能显示为空白：后端结构体缺少 camelCase 序列化声明，界面读不到这两个字段。**不影响生成的材料包内容**，报告数据本身完整。

            下载后可对照本页 `SHA256SUMS.txt` 校验完整性。
