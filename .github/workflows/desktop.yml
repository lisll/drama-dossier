name: Desktop build

on:
  push:
    branches:
      - master
    tags:
      - "app-v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system libraries and ffmpeg
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Rust cache
        uses: swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      # --no-deps：只警告我们自己的代码。依赖库（tauri 系等）在 windows 宿主机
      # 编译构建脚本时会暴露它们自身的 clippy 警告，不由本仓库把关。
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/app-v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # 内容模型：把 whisper.cpp 编出来 + 内置 base 模型，用户端零下载、无 Python 依赖。
      #
      # 为什么自己编而不是下现成的：官方稳定版 release 不带任何预编译资产，
      # macOS 侧只发 xcframework、没有 CLI 可执行文件；Windows 的 CUDA 包 285~685 MB
      # 不适合内置（有显卡的用户由客户端后台自动下载，见 downloads 模块）。
      - name: 准备构建工具（CMake）
        shell: bash
        run: |
          set -euo pipefail
          # Windows runner 自带 cmake；macOS runner 需要确认存在，缺了就用 brew 装
          if ! command -v cmake >/dev/null 2>&1; then
            echo "cmake 缺失，尝试安装"
            if [ "$RUNNER_OS" = "macOS" ]; then brew install cmake; else choco install cmake -y; fi
          fi
          cmake --version | head -1
      - name: 拉取 whisper.cpp 源码
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cd "$RUNNER_TEMP/whisper.cpp"
          echo "whisper.cpp commit: $(git rev-parse HEAD)"
      - name: 编译 whisper-cli（Windows，CPU 版）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "$env:RUNNER_TEMP\whisper.cpp"
          cmake -S $src -B "$env:RUNNER_TEMP\wbuild" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake 配置失败" }
          cmake --build "$env:RUNNER_TEMP\wbuild" --config Release --target whisper-cli -j 4
          if ($LASTEXITCODE -ne 0) { throw "whisper-cli 编译失败" }
          $exe = Get-ChildItem -Recurse -Filter whisper-cli.exe "$env:RUNNER_TEMP\wbuild" | Select-Object -First 1
          if (-not $exe) { throw "找不到 whisper-cli.exe" }
          New-Item -ItemType Directory -Force src-tauri/resources/whisper | Out-Null
          Copy-Item $exe.FullName src-tauri/resources/whisper/
          # 静态链接时还需要同目录的 dll；一并带上，缺了也能跑就不再复制
          Get-ChildItem $exe.DirectoryName -Filter *.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination src-tauri/resources/whisper/ -ErrorAction SilentlyContinue
          Get-ChildItem src-tauri/resources/whisper | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
      - name: 编译 whisper-cli（macOS，arm64 + x86_64 通用，含 Metal）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/whisper.cpp"
          # 一次产出 arm64 + x86_64 通用二进制；Metal 按官方 CI 的做法嵌入
          cmake -S "$src" -B "$RUNNER_TEMP/wbuild" \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build "$RUNNER_TEMP/wbuild" --config Release --target whisper-cli -j 4
          bin="$(find "$RUNNER_TEMP/wbuild" -type f -name whisper-cli -perm -u+x | head -1)"
          if [ -z "$bin" ]; then echo "::error::找不到 whisper-cli"; exit 1; fi
          file "$bin"
          mkdir -p src-tauri/resources/whisper
          cp "$bin" src-tauri/resources/whisper/whisper-cli
          chmod +x src-tauri/resources/whisper/whisper-cli
          ./src-tauri/resources/whisper/whisper-cli --help >/dev/null && echo "自检通过"
          ls -lh src-tauri/resources/whisper
      - name: 内置 base 模型
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/whisper/models
          model=src-tauri/resources/whisper/models/ggml-base.bin
          curl -sSL --retry 5 --max-time 900 -o "$model" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          # 与客户端下载路径使用同一份期望值（HF 的 LFS oid 即 sha256）
          # Windows 的 Git Bash 只有 sha256sum、没有 shasum；macOS 两者都可能有，优先 sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$model" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$model" | awk '{print $1}')
          fi
          expected=60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
          if [ "$actual" != "$expected" ]; then
            echo "::error::ggml-base.bin 校验失败：期望 $expected，实际 $actual"
            exit 1
          fi
          ls -lh "$model"
      # Windows 包内置 ffmpeg/ffprobe（与 build-windows.yml 同源逻辑）：
      # 用户端「一键配置运行环境」从安装包资源复制，零下载。
      - name: 预置 ffmpeg 到安装包资源
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          curl.exe -sSL --retry 5 --max-time 600 -o $zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          if (-not (Test-Path $zip)) { throw "ffmpeg zip 下载失败" }
          $stage = "$env:RUNNER_TEMP\ffstage"
          Expand-Archive -Force $zip $stage
          $bin = (Get-ChildItem -Recurse -Filter ffmpeg.exe $stage | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force src-tauri/resources/ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" src-tauri/resources/ffmpeg/
          Get-ChildItem src-tauri/resources/ffmpeg | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }
      # macOS 包内置 ffmpeg/ffprobe：与 Windows 同一思路，用安装包资源实现运行时零下载。
      # 两个矩阵项架构不同（arm64 / x86_64），evermeet 只提供 x86_64 构建，
      # arm64 上通过 Rosetta 2 运行（自检会在缺 Rosetta 时明确提示）。
      # 下载后校验字节数，与客户端下载路径用的是同一份期望值。
      - name: 预置 ffmpeg 到安装包资源（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources/ffmpeg
          fetch() {
            local name="$1" expect="$2"
            local url="https://evermeet.cx/ffmpeg/${name}-9.0.2.zip"
            local zip="$RUNNER_TEMP/${name}.zip"
            curl -sSL --retry 5 --max-time 600 -o "$zip" "$url"
            local size
            size=$(wc -c < "$zip" | tr -d ' ')
            if [ "$size" != "$expect" ]; then
              echo "::error::${name}.zip 字节数不符：期望 $expect，实际 $size"
              exit 1
            fi
            unzip -o -q "$zip" -d src-tauri/resources/ffmpeg
            rm -f "$zip"
          }
          fetch ffmpeg 26198325
          fetch ffprobe 26104193
          chmod +x src-tauri/resources/ffmpeg/ffmpeg src-tauri/resources/ffmpeg/ffprobe
          ls -lh src-tauri/resources/ffmpeg
          # 自检：Intel runner 直接能跑；arm64 runner 需要 Rosetta 2。
          # 这一步只做“能跑就打印版本”，跑不起来也不让打包失败——
          # 运行时自检（self_check_installed）会在用户机器上给出明确提示。
          if ./src-tauri/resources/ffmpeg/ffmpeg -version >/dev/null 2>&1; then
            ./src-tauri/resources/ffmpeg/ffmpeg -version | head -1
          else
            echo "::warning::内置 ffmpeg 在当前 runner 上无法执行（arm64 可能缺 Rosetta 2），已跳过自检"
            file src-tauri/resources/ffmpeg/ffmpeg || true
          fi
      # 擦除工具：安装版此前完全找不到 dossier-inpaint（只在开发仓库 target/ 里有）。
      # 与内置 ffmpeg 同一方式放进 resources，运行时 erase::locate 优先查这里。
      # 只内置 Rust 管线本体，worker 模式依赖的 Python 与模型权重不随包分发。
      - name: 内置擦除工具（dossier-inpaint）
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p dossier-inpaint --target ${{ matrix.target }}
          mkdir -p src-tauri/resources/inpaint
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/dossier-inpaint.exe" src-tauri/resources/inpaint/
          else
            cp "target/${{ matrix.target }}/release/dossier-inpaint" src-tauri/resources/inpaint/
            chmod +x src-tauri/resources/inpaint/dossier-inpaint
          fi
          ls -lh src-tauri/resources/inpaint
      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
      - name: Upload Windows bundle
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-windows-x64
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 三个平台构建全部成功后，由这**一个** job 统一创建 Release。
  #
  # 为什么不给上面三个 bundle job 直接加发布参数：它们是**并行**跑的，若各自
  # 去创建同一个 Release，会出现「都查到不存在 → 都去创建 → 其中一个失败」
  # 的竞态。单一执行者没有这个问题，且 needs 天然保证「三平台全绿才发布」，
  # 不会产生残缺的 Release。
  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 只取安装包本体：产物解包后 .app/Contents/ 下的散装文件
          # （Info.plist、可执行文件、图标）位于 macos/ 目录，用 **/* 会把它们
          # 一并传上去，用户会看到一堆无意义条目。
          files: |
            artifacts/*/*.exe
            artifacts/*/dmg/*.dmg
            artifacts/SHA256SUMS.txt
          # 任一平台产物缺失就失败，不静默发一个残缺的 Release。
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
          body: |
            > 本项目仅用于技术学习与交流，不用于实际报审提交或对外分发。

            ## 安装前请注意

            **安装包未做代码签名**，系统会给出安全提示，这是正常的：

            - **Windows**：首次运行可能弹出 SmartScreen 提示，点「更多信息」→「仍要运行」。
            - **macOS**：首次打开请在 Finder 中**右键点图标 → 选「打开」**，之后双击即可。直接双击会被 Gatekeeper 拦截。

            **内置运行环境（免手动装 FFmpeg）**：Windows 版安装包已内置
            ffmpeg/ffprobe，应用内点「一键配置运行环境」即可离线完成；macOS
            Apple Silicon 版支持一键在线安装。均无需手动配置 PATH。

            **macOS Intel 版**：不支持一键配置，需手动安装 FFmpeg 并在设置里指定路径。

            ## 已知问题

            - 分集表格的「集号」「文件名」两列可能显示为空白：后端结构体缺少 camelCase 序列化声明，界面读不到这两个字段。**不影响生成的材料包内容**，报告数据本身完整。

            下载后可对照本页 `SHA256SUMS.txt` 校验完整性。
