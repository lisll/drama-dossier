# Windows 内测安装包构建：在 GitHub 的 windows-latest 云端编译（Tauri 不支持从 macOS
# 交叉编译 Windows 包，本地 Mac 只能出 DMG）。只允许手动触发：产物是离线测试版授权，
# 只在 Actions 运行页底部 Artifacts 下载后手动发给内部测试人员，绝不进 Release。
# DramaDossier_x.y.z_x64-setup.exe（NSIS 安装器）。
name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      # 按 Cargo.lock 缓存编译产物；整个仓库是一个 cargo workspace（crates/ + src-tauri/）。
      - name: 缓存编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # 用官方预编译 CLI（解压即用的 cargo-tauri.exe）替代 cargo install 从源码
      # 编译：后者在 Windows 云机上要 10~20 分钟且缓存不覆盖，每次构建都白等。
      # 升级 CLI 版本只需改下面 URL 里的 tag 号（资产名规则见 tauri releases 页）。
      - name: 安装 tauri-cli（预编译）
        shell: pwsh
        run: |
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.4/cargo-tauri-x86_64-pc-windows-msvc.zip"
          $zip = "$env:RUNNER_TEMP\cargo-tauri.zip"
          curl.exe -sSL --retry 5 --max-time 300 -o $zip $url
          if (-not (Test-Path $zip)) { throw "tauri-cli 预编译包下载失败" }
          $dir = "$env:RUNNER_TEMP\cargo-tauri"
          Expand-Archive -Force $zip $dir
          # cargo 对 `cargo tauri` 子命令会按 PATH 查找 cargo-tauri(.exe)，进 PATH 即生效
          echo $dir >> $env:GITHUB_PATH
          Get-ChildItem $dir | ForEach-Object { $_.Name }

      # 把 ffmpeg/ffprobe 直接打进 NSIS 安装包：用户端一键配置时零下载，
      # 不再依赖 gyan.dev 等第三方下载源的可用性（曾出现 404）。
      - name: 预置 ffmpeg 到安装包资源
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          curl.exe -sSL --retry 5 --max-time 600 -o $zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          if (-not (Test-Path $zip)) { throw "ffmpeg zip 下载失败" }
          $stage = "$env:RUNNER_TEMP\ffstage"
          Expand-Archive -Force $zip $stage
          $bin = (Get-ChildItem -Recurse -Filter ffmpeg.exe $stage | Select-Object -First 1).DirectoryName
          New-Item -ItemType Directory -Force src-tauri/resources/ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" src-tauri/resources/ffmpeg/
          Get-ChildItem src-tauri/resources/ffmpeg | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB) }

      - name: 构建 NSIS 安装包（内测版授权）
        shell: bash
        run: cargo tauri build --features license-test-mode

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: DramaDossier-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
