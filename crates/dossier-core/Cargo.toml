[package]
name = "dossier-core"
version = "0.1.0"
edition = "2021"
description = "Core domain logic for drama-dossier (剧备): library scanning, media probing, material checklist, and report package generation."
license = "MIT"

[[bin]]
name = "dossier-artifacts"
path = "src/bin/dossier-artifacts.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dossier-runtime = { path = "../dossier-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
thiserror = "2"
