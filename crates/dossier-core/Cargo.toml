[package]
name = "dossier-core"
version = "0.1.0"
edition = "2021"
description = "Core domain logic for drama-dossier (剧备): library scanning, media probing, material checklist, and report package generation."
license = "MIT"

[[bin]]
name = "dossier-artifacts"
path = "src/bin/dossier-artifacts.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
# 剪映草稿要把 .srt 变成字幕轨，复用 dossier-media 里已经打磨过的 SRT 解析。
# dossier-media 只依赖 dossier-runtime，不依赖 dossier-core，不会成环。
dossier-media = { path = "../dossier-media" }
dossier-license = { path = "../dossier-license" }
dossier-runtime = { path = "../dossier-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"
thiserror = "2"

[dev-dependencies]
# 组装测试：用测试私钥签清单，在临时目录里组装。版本与工作区里已有的一致。
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
tempfile = "=3.27.0"
