[package]
name = "dossier-license"
version = "0.1.0"
edition = "2021"
description = "Offline license verification for drama-dossier (剧备): Ed25519 license tokens, trusted key list, clock-rollback guard, access decision and machine code. Pure logic, no network."
license = "MIT"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
