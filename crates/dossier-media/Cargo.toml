[package]
name = "dossier-media"
version = "0.1.0"
edition = "2021"
description = "Media post-production adapters for drama-dossier (剧备): source separation, time-stretch/pitch, ASR, OCR text recognition, shot boundary detection and ffmpeg-based compositing/render."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dossier-runtime = { path = "../dossier-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 系统自带 OCR：只在对应平台编译，Linux 构建看不到这些依赖。
# 版本与 Cargo.lock 里已有的 windows 0.62.2 对齐，不引入第二份。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }

# objc2-vision / objc2-core-image 与仓库已有的 objc2 0.6 / objc2-foundation 0.3
# 同一条版本线；只开需要的 feature，不整包引入全部框架绑定。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-image = { version = "0.3", default-features = false, features = [
    "std",
    "CIImage",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRecognizeTextRequest",
    "VNRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "VNDetectedPoint",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-core-image",
] }

[[bin]]
name = "dossier-media"
path = "src/main.rs"
