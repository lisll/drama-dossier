[package]
name = "dossier-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime capability management for drama-dossier (剧备): component manifests, environment probing, GPU/encoder/parallelism negotiation, signed update channel, secret store and device fingerprint."
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# 停止 / 超时时按进程组整组终止（kill(-pgid)），避免 python 拉起的 ffmpeg 变成孤儿；版本与 Cargo.lock 已锁定的一致。
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"

[[bin]]
name = "dossier-runtime"
path = "src/main.rs"
