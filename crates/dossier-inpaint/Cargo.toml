[package]
name = "dossier-inpaint"
version = "0.1.0"
edition = "2021"
description = "Hard-subtitle removal pipeline for drama-dossier (剧备): ROI masks, ffmpeg rawvideo I/O, and pluggable text-detection / inpainting backends."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
dossier-core = { path = "../dossier-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# 擦除超时 / 退出时按进程组整组终止（kill(-pgid)、waitid(WNOWAIT)），避免 ffmpeg / python worker 变成孤儿；
# 版本与 dossier-runtime 及 Cargo.lock 已锁定的一致。
[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
