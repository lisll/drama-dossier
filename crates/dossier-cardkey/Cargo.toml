[package]
name = "dossier-cardkey"
version = "0.1.0"
edition = "2021"
description = "剧备授权凭证离线验签、机器码、时钟防回拨与使用权判定（纯逻辑，不依赖 Tauri、不发网络请求）"
license = "MIT"

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.56.0"
