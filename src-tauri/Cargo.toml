[package]
name = "drama-dossier"
version = "0.2.1"
description = "短剧报审材料自动生成工具"
authors = ["DramaDossier contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dossier-core = { path = "../crates/dossier-core" }
dossier-inpaint = { path = "../crates/dossier-inpaint" }
dossier-media = { path = "../crates/dossier-media" }
dossier-runtime = { path = "../crates/dossier-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
dossier-license = { path = "../crates/dossier-license" }
# 联网：和 Tauri 用的是同一个版本；证书校验走系统信任库（rustls-platform-verifier）。
# 用 rustls-no-provider 而不是 rustls：后者默认的 aws-lc-rs 在 Windows 上要装 NASM，
# GitHub 的 Windows runner 没有预装（镜像清单里只有 CMake）。ring 的 crates.io 包自带
# Windows x86-64 的预编译目标文件，不需要 NASM 和 Perl。启动时装 ring（account/api.rs）。
reqwest = { version = "=0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
# 解码服务端发回的报审包文件（标准 base64）。
base64 = "=0.22.1"

# 系统钥匙串：Windows 凭据管理器 / macOS 钥匙串。
# 这两个 feature 漏开的话 keyring 会退回到只存在内存里的假实现且不报错，启动自检会发现它（account/store.rs）。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }

[dev-dependencies]
# 会话测试：假服务端用测试私钥签授权凭证，测试用 tokio 的单线程运行时。
ed25519-dalek = "=2.2.0"
tokio = { version = "=1.53.2", features = ["rt", "macros", "time"] }

[lib]
name = "drama_dossier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
