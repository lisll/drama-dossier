[package]
name = "drama-dossier"
version = "0.2.24"
description = "短剧报审材料自动生成工具"
authors = ["DramaDossier contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 授权构建形态必须显式选择，默认两者都不开：此时没有任何可信公钥，授权恒为「未激活」（fail-closed）。
default = []
# TEST-MODE：离线测试版授权（固定测试卡密，不联网），只用于内部测试包（`--features license-test-mode`）。
# 测试通过后连同 license_test_mode.rs 一起删除，见 docs/LICENSING.md「删除测试版」。
license-test-mode = ["dossier-cardkey/test-issuer"]
# 正式发布包（`--features official-release`）：编译期要求已填正式公钥，且不能与测试模式同时开启。
official-release = []

[dependencies]
dossier-core = { path = "../crates/dossier-core" }
dossier-inpaint = { path = "../crates/dossier-inpaint" }
dossier-cardkey = { path = "../crates/dossier-cardkey" }
dossier-media = { path = "../crates/dossier-media" }
dossier-runtime = { path = "../crates/dossier-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 去重配方 seed 派生（剧名 → SHA-256）；与报审包清单同一套哈希实现。
sha2 = "0.10"
# AI 能力调用（OpenAI 兼容）：TLS 用 rustls，避免本机 openssl 的存量兼容问题。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
tauri = { version = "2", features = [] }
rfd = "0.15"

# 授权状态的第二份存档（防恢复旧授权文件绕过停用 / 时钟回拨）：系统凭据库，只在有原生后端的平台引入。
# Linux 没有后端，退回只看授权文件的旧逻辑（见 license_anchor.rs）。精确锁版本。
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
# 单元测试要在本机签发凭证来驱动授权状态机
dossier-cardkey = { path = "../crates/dossier-cardkey", features = ["test-issuer"] }

[lib]
name = "drama_dossier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
