<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>云端短剧视频制作与多平台适配系统 · 学习原型</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #e6e9ef; --muted: #9aa4b2; --accent: #4f8cff; --ok: #3ddc97;
    --warn: #ffb454; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.55 ui-sans-serif, system-ui, "Noto Sans SC", sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex;
           align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .tag { font-size: 12px; color: var(--warn); border: 1px solid var(--warn);
                border-radius: 999px; padding: 1px 10px; }
  main { padding: 20px 24px 60px; display: grid; gap: 18px;
         grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  section { background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 16px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
               color: var(--muted); margin: 0 0 12px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea, button {
    font: inherit; color: var(--fg); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%;
  }
  textarea { min-height: 76px; font-family: ui-monospace, monospace; font-size: 12px; }
  button { cursor: pointer; background: var(--accent); border-color: var(--accent);
           color: #06101f; font-weight: 600; }
  button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  pre { background: #0b0d12; border: 1px solid var(--line); border-radius: 8px;
        padding: 10px; overflow: auto; max-height: 260px; font-size: 12px; }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .pill { border-radius: 999px; padding: 1px 8px; font-size: 11px; border: 1px solid var(--line); }
  .state-SUCCEEDED { color: var(--ok); border-color: var(--ok); }
  .state-FAILED, .state-CANCELLED { color: var(--err); border-color: var(--err); }
  .state-RUNNING, .state-VERIFYING { color: var(--accent); border-color: var(--accent); }
  .state-QUEUED, .state-RETRY_WAITING, .state-PENDING { color: var(--warn); border-color: var(--warn); }
  .kvs { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
  .kvs div:nth-child(odd) { color: var(--muted); }
  footer { padding: 0 24px 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>云端短剧视频制作与多平台适配系统</h1>
  <span class="tag">学习原型 · 仅用于自有素材</span>
  <span id="who" class="muted"></span>
</header>

<main>
  <section>
    <h2>1 · 连接与身份</h2>
    <label>访问令牌（由 <code>drama-cloud initdb --admin</code> 生成，只保存于浏览器本地）</label>
    <input id="token" type="password" placeholder="粘贴 Bearer 令牌" />
    <div class="row" style="margin-top:10px">
      <button id="save">保存并连接</button>
      <button id="forget" class="ghost">清除</button>
    </div>
    <div id="whoami" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>2 · 系统状态</h2>
    <div id="status" class="muted">未连接</div>
    <button id="refresh" class="ghost" style="margin-top:10px">刷新</button>
  </section>

  <section>
    <h2>3 · 上传素材</h2>
    <label>素材名称</label>
    <input id="assetName" placeholder="第 1 集" />
    <label>素材角色</label>
    <select id="assetRole">
      <option value="video">video（正片）</option>
      <option value="audio">audio</option>
      <option value="subtitle">subtitle（外挂字幕）</option>
      <option value="metadata">metadata</option>
    </select>
    <label>选择文件</label>
    <input id="file" type="file" />
    <button id="upload" style="margin-top:10px">申请上传会话并直传</button>
    <div id="uploadResult" style="margin-top:12px"></div>
    <div id="assets" style="margin-top:14px"></div>
  </section>

  <section>
    <h2>4 · 创建任务</h2>
    <label>配方</label>
    <select id="recipe"></select>
    <label>输入素材（可多选，顺序即 input_index）</label>
    <select id="inputs" multiple size="5"></select>
    <label>参数覆盖（JSON，可留空）</label>
    <textarea id="userParams" placeholder='{"encode": {"crf": 23}}'></textarea>
    <label>幂等键（可选，网络重试不会重复建任务）</label>
    <input id="idem" placeholder="例如 ep01-1080p-v1" />
    <button id="submit" style="margin-top:10px">创建任务</button>
    <div id="taskResult" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>5 · 任务状态</h2>
    <div class="row">
      <input id="taskId" placeholder="tsk_..." />
      <button id="watch" class="ghost" style="flex:0 0 auto">查询</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button id="cancel" class="ghost">请求取消</button>
      <button id="retry" class="ghost">重试</button>
    </div>
    <div id="taskDetail" style="margin-top:12px"></div>
    <div id="tasks" style="margin-top:14px"></div>
  </section>

  <section>
    <h2>6 · 产物</h2>
    <div id="artifacts" class="muted">查询任务后显示</div>
  </section>

  <section>
    <h2>7 · 人工复核队列（擦除确认流）</h2>
    <p class="muted">
      自动校验失败或仅到警告区间的任务会排在这里。自动重试已用尽时，最后一遍擦除结果会
      作为<b>候选产物</b>保留下来：确认可接受就「标记通过」放行，不可接受就「标记失败」，
      需要改参数就「修正后重跑」。放行是人的决定，不是系统的默认结论。
    </p>
    <div class="row">
      <select id="reviewStatus">
        <option value="pending">待处理</option>
        <option value="approved">已通过</option>
        <option value="rejected">已判定失败</option>
        <option value="superseded">已重跑取代</option>
      </select>
      <button id="reviewsRefresh" class="ghost">刷新队列</button>
    </div>
    <div id="reviews" class="muted" style="margin-top:12px">连接后显示</div>
    <div id="reviewDetail" style="margin-top:12px"></div>
  </section>
</main>

<footer>
  边界：本原型仅用于技术学习与处理自有素材，不用于绕过任何平台的识别机制或版权保护。
</footer>

<script src="/static/app.js"></script>
</body>
</html>
