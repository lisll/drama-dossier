# 账号服务的本地开发环境：PostgreSQL + Mailpit（接收验证码邮件，网页查看）。
# 端口只绑定 127.0.0.1。账号密码是开发专用的固定值，不要用在任何对外环境。
# 用法见 cloud/docs/COMMERCE.md。
name: drama-dossier-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: drama
      POSTGRES_PASSWORD: drama-dev-only
      POSTGRES_DB: drama_commerce
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 的镜像把数据放在 /var/lib/postgresql/18/docker，卷挂在上一级目录。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama -d drama_commerce"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # 网页界面与 API

volumes:
  pgdata:
