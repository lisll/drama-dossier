[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drama-cloud"
version = "0.1.0"
description = "云端短剧视频制作与多平台适配系统（控制面 + 媒体 Worker）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    # 账号与授权服务（drama_cloud.commerce）：PostgreSQL 驱动与连接池、argon2id 密码哈希、
    # Ed25519 授权凭证签名
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    # 报审包：fpdf2 排版 PDF（能嵌入 Noto CJK 这类 CFF 中文字体），pypdf 叠加签章层、替换扫描页
    "fpdf2==2.8.3",
    "pypdf==5.4.0",
    # 媒体控制面用 HTTP 客户端调 commerce 验证用户身份（identity.py）。
    # 曾经只放在 dev extras 里：本地 venv 一直有它所以测试全过，
    # 生产镜像不带 dev extras，media 容器起不来（冒烟部署抓出来的）。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drama-cloud = "drama_cloud.cli:main"
drama-commerce = "drama_cloud.commerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drama_cloud = ["web/*.html", "commerce/migrations/*.sql", "commerce/web/*.html", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
