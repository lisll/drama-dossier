[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-license"
version = "0.1.0"
description = "剧备 DramaDossier 卡密授权服务（卡密兑换、Ed25519 授权凭证、网页管理后台）"
requires-python = ">=3.10"
# 运行依赖精确锁定；生产部署再用 requirements.lock + --require-hashes 校验哈希。
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
license-admin = "dd_license.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dd_license = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
